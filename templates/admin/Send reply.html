{% extends 'admin/admin_index.html' %}
{% block body %}

<style>
.page-wrapper {
    min-height: 100vh;
    padding: 40px 20px;
    background: #f7f7f7;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Outer gradient card */
.reply-section {
    width: 100%;
    max-width: 600px;
    background: linear-gradient(135deg, #ff512f, #ff914d);
    padding: 25px;
    border-radius: 22px;
    box-shadow: 0 8px 35px rgba(0,0,0,0.25);
    animation: fadeSlide 0.8s ease-out;
}

/* Inner white card */
.inner-card {
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 18px;
}

@keyframes fadeSlide {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.head1 {
    text-align: center;
    font-weight: 800;
    margin-bottom: 25px;
    color: #333;
}

textarea {
    resize: none;
}
</style>

<div class="page-wrapper">

    <div class="reply-section">
        <div class="inner-card">

            <h2 class="head1">Send Reply</h2>

            <form action="/myapp/send_reply/" method="post">
                {% csrf_token %}

                <!-- Hidden Complaint ID -->
                <input type="hidden" name="cus_id" value="{{ a.id }}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Reply Message</label>
                    <textarea name="reply"
                              class="form-control"
                              rows="5"
                              placeholder="Type your reply here..."
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Send Reply
                </button>
            </form>

        </div>
    </div>

</div>

{% endblock %}
