<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Details</title>
</head>
<body>

    <h2>approved  Shop </h2>

    <table border="1" cellspacing="0" cellpadding="5">

        <tr>
            <th>Shop Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Place</th>
            <th>Post</th>
            <th>PIN</th>
            <th>Licence No</th>
            <th>Shop Image</th>
            <th>Owner Name</th>
            <th>Owner Image</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.sname }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.phone_no }}</td>
            <td>{{ i.place }}</td>
            <td>{{ i.post }}</td>
            <td>{{ i.pin }}</td>
            <td>{{ i.license_number }}</td>

            <td>
                <img src="{{ i.shop_image }}" alt="Shop Image" width="100">
            </td>

            <td>{{ i.owner_name }}</td>

            <td>
                <img src="{{ i.owner_profile }}" alt="Owner Image" width="100">
            </td>
            <td>{{ i.status }}</td>
        <td>
            <button><a href="/Approve_shop/{{ i.id }}">approve</a></button>
        </td>

        </tr>
        {% endfor %}

    </table>

</body>
</html>
