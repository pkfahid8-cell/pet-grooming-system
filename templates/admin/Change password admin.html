{% extends 'admin/admin_index.html' %}
{% block body %}

<!-- GLOBAL SMOOTH SCROLL -->
<style>
html, body {
    scroll-behavior: smooth !important;
}
</style>

<style>

/* PAGE WRAPPER */
.page-wrapper {
    min-height: 100vh;
    padding: 40px 20px;
    background: #f8f8f8;
}

/* TITLE */
.page-title {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 800;
    color: #333;
    margin-bottom: 25px;
}

/* ORANGE OUTER BOX */
.outer-box {
    max-width: 550px;
    margin: auto;
    background: #ff6d33;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0px 10px 35px rgba(0,0,0,0.20);
}

/* WHITE INNER BOX */
.inner-box {
    background: #fff6f0;
    padding: 30px;
    border-radius: 18px;
}

/* INPUT FIELDS */
.input-box {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #ff6d33;
    outline: none;
    font-size: 15px;
    background: white;
}

/* LABEL STYLE */
.form-label {
    font-weight: 600;
    margin-bottom: 5px;
    color: #444;
}

/* BUTTON */
.submit-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #ff6d33;
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #e1541c;
}

/* MESSAGE STYLES */
.error-msg {
    color: #d60000;
    margin-top: 12px;
    font-weight: 600;
}

.success-msg {
    color: #009b1a;
    margin-top: 12px;
    font-weight: 600;
}

</style>



<div class="page-wrapper">

    <h2 class="page-title">Change Password</h2>

    <div class="outer-box">
        <div class="inner-box">

            <form action="/myapp/change_password_admin_post/" method="post">
                {% csrf_token %}

                <!-- OLD PASSWORD -->
                <div class="mb-3">
                    <label class="form-label">Old Password</label>
                    <input type="password" name="Old_Password" class="input-box" required>
                </div>

                <!-- NEW PASSWORD -->
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="New_password" class="input-box" required>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="Confirm_password" class="input-box" required>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="submit-btn">Change Password</button>

                <!-- MESSAGES -->
                {% if error %}
                    <p class="error-msg">{{ error }}</p>
                {% endif %}

                {% if success %}
                    <p class="success-msg">{{ success }}</p>
                {% endif %}
            </form>

        </div>
    </div>
</div>

{% endblock %}
