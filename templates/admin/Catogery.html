{% extends 'admin/admin_index.html' %}
{% block body %}

<style>
    /* Custom styles for add category page */
    .category-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
    }
    
    .category-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.1);
        padding: 40px;
        border: 1px solid #eaeaea;
    }
    
    .category-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .category-header h2 {
        color: #333;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 10px;
        position: relative;
        padding-bottom: 15px;
    }
    
    .category-header h2:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 3px;
        background: linear-gradient(to right, #ea210a, #ff5923);
        border-radius: 2px;
    }
    
    .category-form {
        width: 100%;
    }
    
    .form-group {
        margin-bottom: 25px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #444;
        font-size: 16px;
    }
    
    .form-control {
        width: 100%;
        padding: 12px 16px;
        font-size: 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        transition: all 0.3s ease;
        background: #f9f9f9;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-control::placeholder {
        color: #999;
    }
    
    .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(to right, #ea210a, #ff5923);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }
    
    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(102, 126, 234, 0.3);
    }
    
    .submit-btn:active {
        transform: translateY(0);
    }
    
    /* Back button */
    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }
    
    .back-link:hover {
        color: #764ba2;
    }
    
    .back-link i {
        margin-right: 8px;
    }
    
    /* Success/Error Messages */
    .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-weight: 500;
    }
    
    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    /* Form Validation Styles */
    .error-message {
        color: #dc3545;
        font-size: 14px;
        margin-top: 5px;
        display: none;
    }
    
    .form-control.error {
        border-color: #dc3545;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
        .category-container {
            padding: 20px 15px;
        }
        
        .category-card {
            padding: 30px 20px;
        }
        
        .category-header h2 {
            font-size: 24px;
        }
        
        .form-control {
            padding: 10px 14px;
            font-size: 15px;
        }
        
        .submit-btn {
            padding: 12px;
            font-size: 15px;
        }
    }
    
    @media (max-width: 480px) {
        .category-card {
            padding: 25px 15px;
        }
        
        .category-header h2 {
            font-size: 22px;
        }
    }
</style>

<div class="content-wrapper">
    <div class="category-container">
        <!-- Back button -->
        <a href="javascript:history.back()" class="back-link">
            <i class="fa fa-arrow-left"></i> Back to Previous
        </a>
        
        <div class="category-card">
            <div class="category-header">
                <h2>Add New Category</h2>
                <p>Create a new product category for your store</p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="post" action="/myapp/add_category_post/" class="category-form" id="addCategoryForm">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="cat_name">Category Name</label>
                    <input type="text" 
                           id="cat_name" 
                           name="cat_name" 
                           class="form-control" 
                           placeholder="Enter category name (e.g., Dog Food, Cat Toys, etc.)" 
                           required
                           maxlength="100">
                    <div class="error-message" id="nameError"></div>
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="fa fa-plus-circle"></i> Add Category
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // Form Validation
    document.getElementById('addCategoryForm').addEventListener('submit', function(e) {
        var categoryName = document.getElementById('cat_name').value.trim();
        var nameError = document.getElementById('nameError');
        
        // Reset error
        nameError.style.display = 'none';
        document.getElementById('cat_name').classList.remove('error');
        
        // Validate category name
        if (categoryName.length < 2) {
            e.preventDefault();
            nameError.textContent = 'Category name must be at least 2 characters long.';
            nameError.style.display = 'block';
            document.getElementById('cat_name').classList.add('error');
            document.getElementById('cat_name').focus();
            return false;
        }
        
        if (categoryName.length > 100) {
            e.preventDefault();
            nameError.textContent = 'Category name must not exceed 100 characters.';
            nameError.style.display = 'block';
            document.getElementById('cat_name').classList.add('error');
            document.getElementById('cat_name').focus();
            return false;
        }
        
        // Check for special characters (optional)
        var regex = /^[a-zA-Z0-9\s\-&]+$/;
        if (!regex.test(categoryName)) {
            e.preventDefault();
            nameError.textContent = 'Category name can only contain letters, numbers, spaces, hyphens, and ampersands.';
            nameError.style.display = 'block';
            document.getElementById('cat_name').classList.add('error');
            document.getElementById('cat_name').focus();
            return false;
        }
        
        return true;
    });
    
    // Auto focus on category name field
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('cat_name').focus();
    });
    
    // Clear error on input
    document.getElementById('cat_name').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('nameError').style.display = 'none';
    });
</script>

{% endblock %}
