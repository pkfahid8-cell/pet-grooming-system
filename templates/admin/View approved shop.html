<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Shop</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <style>
        img {
            border-radius: 6px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">Approved Shop</h2>

    <div class="table-responsive">
        <table id="shopTable" class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Shop Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Place</th>
                    <th>Post</th>
                    <th>PIN</th>
                    <th>Licence No</th>
                    <th>Shop Image</th>
                    <th>Owner Name</th>
                    <th>Owner Image</th>
                </tr>
            </thead>

            <tbody>
            {% for i in data %}
                <tr>
                    <td>{{ i.sname }}</td>
                    <td>{{ i.email }}</td>
                    <td>{{ i.phone_no }}</td>
                    <td>{{ i.place }}</td>
                    <td>{{ i.post }}</td>
                    <td>{{ i.pin }}</td>
                    <td>{{ i.license_number }}</td>

                    <td><img src="/media/{{ i.shop_image }}" width="90"></td>

                    <td>{{ i.owner_name }}</td>

                    <td><img src="/media/{{ i.owner_profile }}" width="90"></td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
    $(document).ready(function () {
        $('#shopTable').DataTable({
            pageLength: 5,
            lengthMenu: [5, 10, 20, 30],
            ordering: true
        });
    });
</script>

</body>
</html>
