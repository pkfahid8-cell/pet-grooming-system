{% extends 'Staff/shop_index.html' %}
{% block body %}

<style>

    html, body {
        scroll-behavior: smooth !important;
        background: #f1f3f5 !important;
        font-family: "Poppins", sans-serif;
    }

    .update-wrapper {
        max-width: 650px;
        margin: 40px auto;
    }

    /* Orange Header */
    .header-box {
        background: linear-gradient(135deg, #ff512f, #ff914d);
        padding: 16px;
        text-align: center;
        color: white;
        font-size: 1.6rem;
        font-weight: 700;
        border-radius: 16px 16px 0 0;
    }

    /* Card Body */
    .card-custom {
        background: #ffffff;
        padding: 22px;
        border-radius: 0 0 16px 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    /* Info Boxes */
    .info-box {
        background: #fff7ef;
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 12px;
        border-left: 4px solid #ff6b00;
    }

    .info-label {
        font-weight: 700;
        color: #ff6b00;
        margin-right: 5px;
    }

    /* Dropdown Styling */
    .form-select {
        border: 2px solid #ffb37a;
        padding: 10px;
        border-radius: 10px;
        transition: .3s;
        font-size: 15px;
    }

    .form-select:focus {
        border-color: #ff6b00;
        box-shadow: 0 0 10px rgba(255,110,0,0.35);
    }

    /* Button Styling */
    .btn-orange {
        background: linear-gradient(135deg, #ff6b00, #ff8500);
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 10px;
        font-size: 17px;
        color: white;
        font-weight: 700;
        transition: 0.3s;
    }

    .btn-orange:hover {
        background: linear-gradient(135deg, #ff4f00, #ff7400);
        transform: translateY(-2px);
    }

</style>


<div class="update-wrapper">

    <!-- ORANGE HEADER -->
    <div class="header-box">
        Update Grooming Booking Status
    </div>

    <div class="card-custom">

        <form action="/myapp/update_booking_post/" method="post">
            {% csrf_token %}

            <input type="hidden" name="gb_id" value="{{ booking.id }}">

            <!-- USER -->
            <div class="info-box">
                <span class="info-label">User:</span> {{ booking.USER.cname }}
            </div>

            <!-- SERVICE -->
            <div class="info-box">
                <span class="info-label">Service:</span> {{ booking.SERVICE.service_name }}
            </div>

            <!-- PET -->
            <div class="info-box">
                <span class="info-label">Pet Name:</span> {{ booking.pet_name }}
            </div>

            <!-- DATE -->
            <div class="info-box">
                <span class="info-label">Date:</span> {{ booking.date }}
            </div>

            <!-- TIME -->
            <div class="info-box">
                <span class="info-label">Time:</span> {{ booking.time }}
            </div>

            <!-- STATUS SELECT -->
            <div class="mb-3 mt-2">
                <label class="form-label fw-bold">Change Status</label>
                <select name="status" class="form-select" required>
                    <option value="pending"   {% if booking.status == "pending" %}selected{% endif %}>Pending</option>
                    <option value="accepted"  {% if booking.status == "accepted" %}selected{% endif %}>Accepted</option>
                    <option value="completed" {% if booking.status == "completed" %}selected{% endif %}>Completed</option>
                    <option value="rejected"  {% if booking.status == "rejected" %}selected{% endif %}>Rejected</option>
                </select>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-orange" onclick="localStorage.setItem('scrollToTable','yes')">
                Update Status
            </button>

        </form>

    </div>

</div>

{% endblock %}
