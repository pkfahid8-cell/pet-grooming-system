{% extends 'Staff/shop_index.html' %}
{% block body %}

<style>

    html, body {
        scroll-behavior: smooth !important;
        background: #f1f3f5 !important;
        font-family: "Poppins", sans-serif;
    }

    .page-wrapper {
        max-width: 500px;
        margin: 50px auto;
    }

    /* Card */
    .card-custom {
        background: #ffffff;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 6px 30px rgba(0,0,0,0.12);
        animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Title */
    .header-box {
        background: linear-gradient(135deg, #ff512f, #ff914d);
        padding: 15px;
        color: #fff;
        text-align: center;
        border-radius: 14px;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 20px;
    }

    /* Inputs */
    .form-control {
        border: 2px solid #ffc49a;
        padding: 10px;
        border-radius: 10px;
        transition: .3s;
        font-size: 15px;
    }

    .form-control:focus {
        border-color: #ff6b00;
        background: #fff7ef;
        box-shadow: 0 0 8px rgba(255,110,0,0.35);
    }

    /* Button */
    .btn-orange {
        background: linear-gradient(135deg, #ff6b00, #ff8500);
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 10px;
        font-weight: 700;
        font-size: 17px;
        color: white;
        transition: .3s;
    }

    .btn-orange:hover {
        background: linear-gradient(135deg, #ff4f00, #ff6d00);
        transform: translateY(-2px);
    }

    .alert-msg {
        margin-top: 12px;
        font-weight: 600;
        text-align: center;
    }

</style>


<div class="page-wrapper">

    <div class="header-box">
        Change Password
    </div>

    <div class="card-custom">

        <form action="/myapp/change_password_shop_post/" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold">Old Password</label>
                <input type="password" name="Old_Password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">New Password</label>
                <input type="password" name="New_password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Confirm Password</label>
                <input type="password" name="Confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="btn-orange">Change Password</button>

            <!-- Error Alert -->
            {% if error %}
                <p class="alert-msg" style="color:red;">{{ error }}</p>
            {% endif %}

            <!-- Success Alert -->
            {% if success %}
                <p class="alert-msg" style="color:green;">{{ success }}</p>
            {% endif %}

        </form>

    </div>

</div>

{% endblock %}
